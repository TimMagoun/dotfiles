[terminal]
shell = { program = "/bin/zsh", args = ["-l"] }

[font]
size = 12.0

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Bold Italic"

[window]
padding = { x = 5, y = 5 }
# Make alt+key shortcuts work
option_as_alt = "Both"

[[keyboard.bindings]]
key = "F"
mods = "Command|Control"
action = "None"
