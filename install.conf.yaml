# Shared dotfiles installed for both home and work profiles.
- defaults:
    link:
      relink: true

- clean: ["~"]

- link:
    ~/.gitconfig: gitconfig
    ~/.profile: profile
    ~/.zprofile: zprofile
    ~/.zshenv: zshenv
    ~/.tmux.conf: tmux.conf
    ~/.vimrc: vimrc
    ~/.zshrc: zshrc
    ~/.gitignore: gitignore
    ~/.config/alacritty/alacritty.toml:
      path: alacritty/alacritty.toml
      create: true
    ~/.config/gh/config.yml:
      path: gh/config.yml
      create: true
    ~/.p10k.zsh: p10k.zsh
    ~/.config/karabiner:
      path: karabiner
      create: true

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [brew bundle]
