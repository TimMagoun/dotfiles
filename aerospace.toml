# AeroSpace Configuration
config-version = 2

# Start AeroSpace at login
start-at-login = true

# Launch Borders at startup with purple/berry color
# ax_focus=on uses accessibility API for better rendering compatibility
after-startup-command = [
    'exec-and-forget borders active_color=0xff19effa inactive_color=0x003d3d5c width=6 hidpi=on order=above'
]

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Accordion padding
accordion-padding = 30

# Default layout and orientation
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Disable accidental cmd-h
automatically-unhide-macos-hidden-apps = true

# Keep 5 workspaces alive
persistent-workspaces = ["1", "2", "3", "4", "5"]

# Keyboard layout (QWERTY by default)
[key-mapping]
    preset = 'qwerty'

# Gaps: 4px on all sides
[gaps]
    inner.horizontal = 3
    inner.vertical = 3
    outer.left = 3
    outer.bottom = 3
    outer.top = 3
    outer.right = 3

[mode.main.binding]
    # Layout switching
    alt-shift-slash = 'layout tiles horizontal vertical'
    alt-shift-comma = 'layout accordion horizontal vertical'

    # Focus navigation (hjkl)
    alt-h = 'exec-and-forget aerospace focus left --boundaries-action fail || aerospace list-workspaces --monitor focused --empty no | aerospace workspace prev --stdin'
    alt-l = 'exec-and-forget aerospace focus right --boundaries-action fail || aerospace list-workspaces --monitor focused --empty no | aerospace workspace next --stdin'

    alt-j = 'focus down --boundaries all-monitors-outer-frame'
    alt-k = 'focus up --boundaries all-monitors-outer-frame'

    # Window movement (alt+shift+hjkl)
    alt-shift-h = 'move left --boundaries all-monitors-outer-frame'
    alt-shift-j = 'move down --boundaries all-monitors-outer-frame'
    alt-shift-k = 'move up --boundaries all-monitors-outer-frame'
    alt-shift-l = 'move right --boundaries all-monitors-outer-frame'

    # Resize windows
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Toggle float (alt+shift+f)
    alt-shift-f = 'layout floating tiling'

    # Toggle fullscreen (alt+shift+m)
    alt-shift-m = 'fullscreen'

    # Join with node (alt+shift+y,u,i,o)
    alt-shift-y = 'join-with left'
    alt-shift-u = 'join-with down'
    alt-shift-i = 'join-with up'
    alt-shift-o = 'join-with right'

    # Workspace switching (alt+1..5)
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'

    # Workspace navigation
    alt-comma = 'workspace prev'
    alt-period = 'workspace next'

    # Move node to workspace and follow focus
    alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
    alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
    alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
    alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
    alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
    alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'

    # Workspace navigation
    alt-tab = 'workspace-back-and-forth'

    # Reload config (alt+r)
    alt-r = 'reload-config'

    # Reset layout (alt+shift+r)
    alt-shift-r = 'flatten-workspace-tree'

    # Launch applications
    # Terminal (Alacritty) with alt+t
    alt-t = 'exec-and-forget open -n -a Alacritty'
    alt-shift-t = 'exec-and-forget open -a Alacritty'
    # Browser (Safari) with alt+w
    alt-w = 'exec-and-forget open -n -a Safari'
    alt-shift-w = 'exec-and-forget open -a Safari'

# App-to-workspace assignments
# Workspace 1: Mail, Slack
[[on-window-detected]]
    if.app-id = 'com.apple.mail'
    run = 'move-node-to-workspace 1'

[[on-window-detected]]
    if.app-id = 'com.tinyspeck.slackmacgap'
    run = 'move-node-to-workspace 1'

# Workspace 2: Obsidian
[[on-window-detected]]
    if.app-id = 'md.obsidian'
    run = 'move-node-to-workspace 2'

# Workspace 3: Reminders
[[on-window-detected]]
    if.app-id = 'com.apple.reminders'
    run = 'move-node-to-workspace 3'

# Workspace 4: VS Code
[[on-window-detected]]
    if.app-id = 'com.microsoft.VSCode'
    run = 'move-node-to-workspace 4'

# Workspace 5: Safari
[[on-window-detected]]
    if.app-id = 'com.apple.Safari'
    run = 'move-node-to-workspace 5'

[workspace-to-monitor-force-assignment]
   6 = 'secondary'
