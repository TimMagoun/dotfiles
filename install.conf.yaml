- defaults:
    link:
      relink: true

- clean: ["~"]

- link:
    ~/.aerospace.toml: aerospace.toml
    ~/.gitconfig: gitconfig
    ~/.profile: profile
    ~/.zprofile: zprofile
    ~/.zshenv: zshenv
    ~/.tmux.conf: tmux.conf
    ~/.vimrc: vimrc
    ~/.zshrc: zshrc
    ~/.gitignore: gitignore
    ~/.config/alacritty/alacritty.toml:
      path: alacritty/alacritty.toml
      create: true
    ~/.config/gh/config.yml:
      path: gh/config.yml
      create: true
    ~/.config/Code/User/settings.json:
      path: vscode/settings.json
      create: true
    ~/.config/Code/User/keybindings.json:
      path: vscode/keybindings.json
      create: true
    ~/.config/mpv/input.conf:
      path: mpv/input.conf
      create: true
    ~/.config/mpv/mpv.conf:
      path: mpv/mpv.conf
      create: true
    ~/.p10k.zsh: p10k.zsh
    ~/.config/karabiner/karabiner.json:
      path: karabiner.json
      create: true

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [brew bundle]
